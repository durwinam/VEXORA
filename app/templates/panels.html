{% extends 'base.html' %}{% block title %}پنل‌ها | VEXORA{% endblock %}{% block content %}<main class="container dashboard"><div class="page-head"><div><span class="eyebrow">PANELS</span><h1>اتصال پنل‌ها</h1></div><a class="btn" href="{{ settings.admin_path }}">داشبورد</a></div><div class="grid-2"><form class="card form" method="post"><h3>افزودن پنل</h3><label>نام<input name="name" required></label><label>نوع<select name="kind"><option>generic</option><option>pasarguard</option><option>3x-ui</option><option>marzban</option></select></label><label>آدرس API<input name="base_url" placeholder="https://panel.example.com" required></label><label>Username<input name="username"></label><label>Password<input type="password" name="password"></label><label class="check"><input type="checkbox" name="verify_tls" checked> بررسی TLS</label><button class="btn primary full">ذخیره پنل</button></form><div class="card"><h3>پنل‌های ثبت‌شده</h3>{% for p in panels %}<div class="list-row"><div><b>{{ p.name }}</b><small>{{ p.kind }} · {{ p.base_url }}</small></div><span class="status-dot"></span></div>{% else %}<p class="muted">هنوز پنلی ثبت نشده است.</p>{% endfor %}</div></div></main>{% endblock %}
