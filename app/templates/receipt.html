{% extends 'base.html' %}
{% block title %}ارسال رسید | VEXORA{% endblock %}
{% block content %}
<main class="container narrow dashboard">
  <div class="page-head"><div><span class="eyebrow">ORDER #{{ order.id }}</span><h1>ارسال رسید پرداخت</h1><p>پلن <b>{{ order.plan_name }}</b> · مبلغ {{ '{:,.0f}'.format(order.price) }} تومان</p></div></div>
  <form class="card form" method="post" enctype="multipart/form-data">
    <label>مبلغ پرداختی<input type="number" name="amount" min="0" value="{{ order.price }}" required></label>
    <label>فایل رسید<input type="file" name="receipt" accept=".jpg,.jpeg,.png,.webp,.pdf" required></label>
    <button class="btn primary full">ثبت رسید</button>
  </form>
</main>
{% endblock %}
