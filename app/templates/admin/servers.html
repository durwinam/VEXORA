<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سرورها — VEXORA</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="admin-page"><main class="dashboard"><div class="page-header"><div><span class="eyebrow">SERVERS</span><h1>سرورها</h1><p>موقعیت و ظرفیت زیرساخت</p></div><a class="ghost-button" href="/admin/">داشبورد</a></div><section class="panel-card"><form method="post" action="/admin/servers/create" class="admin-form"><input name="name" placeholder="نام سرور" required><input name="country" placeholder="کشور"><input name="host" placeholder="IP / Host"><input name="port" type="number" value="443" min="1" max="65535"><button class="primary-button">افزودن سرور</button></form><table class="admin-table"><thead><tr><th>نام</th><th>کشور</th><th>Host</th><th>پورت</th><th>وضعیت</th><th>ظرفیت</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{row["name"]}}</td><td>{{row["country"]}}</td><td>{{row["host"]}}</td><td>{{row["port"]}}</td><td>{{row["status"]}}</td><td>{{row["used"]}} / {{row["capacity"] or "∞"}}</td></tr>{% else %}<tr><td colspan="6" class="empty-table">سروری ثبت نشده است.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
