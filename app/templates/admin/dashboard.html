<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>مدیریت — VEXORA</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >
</head>

<body class="admin-page">

    <aside class="sidebar">

        <div class="brand">
            <span class="brand-mark">V</span>
            <span>VEXORA</span>
        </div>

        <nav>

            <a
                class="active"
                href="/admin/"
            >
                📊 داشبورد
            </a>

            <a href="/shop/">
                🛒 فروشگاه
            </a>

        </nav>

        <form
            method="post"
            action="/admin/logout"
        >
            <button class="logout-button">
                🚪 خروج
            </button>
        </form>

    </aside>

    <main class="dashboard">

        <header class="dashboard-header">

            <div>

                <span class="eyebrow">
                    ADMIN PANEL
                </span>

                <h1>
                    خوش آمدی، {{ username }}
                </h1>

            </div>

            <span class="version-badge">
                v1.0.0
            </span>

        </header>

        <section class="stats-grid">

            <article class="stat-card">
                <span>محصولات</span>
                <strong>{{ products }}</strong>
            </article>

            <article class="stat-card">
                <span>سفارش‌ها</span>
                <strong>{{ orders }}</strong>
            </article>

            <article class="stat-card">
                <span>وضعیت</span>
                <strong>Online</strong>
            </article>

        </section>

        <section class="panel-card">

            <h2>
                وضعیت سیستم
            </h2>

            <div class="status-row">
                <span>Backend</span>
                <b class="status-ok">
                    ● فعال
                </b>
            </div>

            <div class="status-row">
                <span>Database</span>
                <b class="status-ok">
                    ● فعال
                </b>
            </div>

            <div class="status-row">
                <span>Version</span>
                <b>
                    1.0.0
                </b>
            </div>

        </section>

    </main>

</body>

</html>
