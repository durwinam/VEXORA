<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پشتیبانی — VEXORA</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="admin-page"><main class="dashboard"><div class="page-header"><div><span class="eyebrow">SUPPORT</span><h1>پشتیبانی</h1><p>مدیریت درخواست‌های کاربران</p></div><a class="ghost-button" href="/admin/">داشبورد</a></div><section class="panel-card"><table class="admin-table"><thead><tr><th>#</th><th>موضوع</th><th>پیام</th><th>اولویت</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{row["id"]}}</td><td>{{row["subject"]}}</td><td>{{row["message"][:100]}}</td><td>{{row["priority"]}}</td><td><form method="post" action="/admin/support/{{row['id']}}/status"><select name="status"><option value="open" {% if row["status"]=="open" %}selected{% endif %}>open</option><option value="pending" {% if row["status"]=="pending" %}selected{% endif %}>pending</option><option value="closed" {% if row["status"]=="closed" %}selected{% endif %}>closed</option></select><button class="mini-button">ذخیره</button></form></td><td>{{row["created_at"]}}</td></tr>{% else %}<tr><td colspan="6" class="empty-table">تیکتی وجود ندارد.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
