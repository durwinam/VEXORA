<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش‌ها — VEXORA</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="admin-page"><main class="dashboard"><div class="page-header"><div><span class="eyebrow">ORDERS</span><h1>سفارش‌ها</h1><p>مدیریت سفارش‌های فروشگاه</p></div><a class="ghost-button" href="/admin/">داشبورد</a></div><section class="panel-card"><table class="admin-table"><thead><tr><th>کد</th><th>مشتری</th><th>پلن</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row["order_code"] }}</td><td>{{ row["customer_name"] or "ناشناس" }}</td><td>{{ row["product_name"] or "—" }}</td><td>{{ "{:,}".format(row["amount"]) }} تومان</td><td><form method="post" action="/admin/orders/{{ row['id'] }}/status"><select name="status">{% for s in ["pending","paid","cancelled","refunded"] %}<option value="{{s}}" {% if row["status"]==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="mini-button">ذخیره</button></form></td><td>{{ row["created_at"] }}</td></tr>{% else %}<tr><td colspan="6" class="empty-table">سفارشی ثبت نشده است.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
