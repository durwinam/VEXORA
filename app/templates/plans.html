<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پلن‌ها — VEXORA</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="admin-page"><main class="dashboard"><div class="page-header"><div><span class="eyebrow">PLANS</span><h1>پلن‌ها</h1><p>ایجاد و مدیریت محصولات فروشگاه</p></div><a class="ghost-button" href="/admin/">داشبورد</a></div><section class="panel-card"><form method="post" action="/admin/plans/create" class="admin-form"><input name="name" placeholder="نام پلن" required><input name="description" placeholder="توضیحات"><input name="price" type="number" min="0" placeholder="قیمت" required><input name="volume_gb" type="number" min="0" placeholder="حجم GB"><input name="duration_days" type="number" min="1" value="30"><input name="devices" type="number" min="1" value="1"><input name="badge" placeholder="برچسب"><button class="primary-button">افزودن پلن</button></form><table class="admin-table"><thead><tr><th>پلن</th><th>قیمت</th><th>حجم</th><th>اعتبار</th><th>وضعیت</th><th></th></tr></thead><tbody>{% for row in rows %}<tr><td>{{row["name"]}}<small>{{row["badge"]}}</small></td><td>{{"{:,}".format(row["price"])}}</td><td>{{row["volume_gb"] or "نامحدود"}}</td><td>{{row["duration_days"]}} روز</td><td>{{"فعال" if row["active"] else "غیرفعال"}}</td><td><form method="post" action="/admin/plans/{{row['id']}}/toggle"><button class="mini-button">تغییر</button></form></td></tr>{% endfor %}</tbody></table></section></main></body></html>
