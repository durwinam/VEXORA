<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاربران — VEXORA</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="admin-page"><main class="dashboard"><div class="page-header"><div><span class="eyebrow">USERS</span><h1>کاربران</h1><p>مشتریان و وضعیت حساب‌ها</p></div><a class="ghost-button" href="/admin/">داشبورد</a></div><section class="panel-card"><table class="admin-table"><thead><tr><th>نام</th><th>نام کاربری</th><th>ایمیل</th><th>تلفن</th><th>وضعیت</th><th>موجودی</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{row["name"] or "بدون نام"}}</td><td>{{row["username"] or "—"}}</td><td>{{row["email"] or "—"}}</td><td>{{row["phone"] or "—"}}</td><td>{{row["status"]}}</td><td>{{"{:,}".format(row["balance"])}}</td></tr>{% else %}<tr><td colspan="6" class="empty-table">کاربری ثبت نشده است.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
