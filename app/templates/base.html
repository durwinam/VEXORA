<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b11">
  <title>{% block title %}VEXORA{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="{{ settings.shop_path }}"><span class="brand-icon">V</span><span>VEXORA</span></a>
    <nav><a href="{{ settings.shop_path }}">فروشگاه</a><a href="{{ settings.admin_path }}">مدیریت</a></nav>
    <button class="icon-btn" data-theme-toggle aria-label="تغییر پوسته">☾</button>
  </div>
</header>
{% block content %}{% endblock %}
<footer><div class="container footer-row"><span>© {{ settings.version }} · durwinam</span><span>VEXORA Configuration Shop</span></div></footer>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
